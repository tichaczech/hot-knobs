# Configuration for the Shared Users application module.

code: shared-users
name: Shared.Users

build:
  packages:
  - 'thc.HotKnobs.Shared.Users.Contracts'
  containers:
  - projectDirectory: ./Server
    dockerfile: .docker/Dockerfile.dotNet.Server
    entrypointDll: thc.HotKnobs.Shared.Users.Server.dll
    imageName: hotknobs/shared/users/server

contracts:
  file: ./Contracts/Users.Contracts.tsp

ef:
  contexts:
  - contextName: PostgresUsersContext
    projectDirectory: Persistence.Postgres
    projectName: Users.Persistence.Postgres.csproj

