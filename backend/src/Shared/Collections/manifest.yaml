# Configuration for the Shared Collections application module.

code: shared-collections
name: Shared.Collections

build:
  packages:
  - 'thc.HotKnobs.Shared.Collections.Contracts'
  containers:
  - projectDirectory: ./Server
    dockerfile: .docker/Dockerfile.dotNet.Server
    entrypointDll: thc.HotKnobs.Shared.Collections.Server.dll
    imageName: hotknobs/shared/collections/server

contracts:
  file: ./Contracts/Collections.Contracts.tsp

ef:
  contexts:
  - contextName: PostgresCollectionsContext
    projectDirectory: Persistence.Postgres
    projectName: Collections.Persistence.Postgres.csproj
