# Configuration for the Dummy application module.

code: domains-dummy
name: Domains.Dummy

build:
  packages:
    - 'HotKnobs.Domains.Dummy.Contracts'
  containers:
    - projectDirectory: ./Server
      dockerfile: .docker/Dockerfile.dotNet.Server
      entrypointDll: thc.HotKnobs.Domains.Dummy.Server.dll
      imageName: thc/app/hotknobs/backend/domains/dummy/server
    # - projectDirectory: ./Worker
    #   dockerfile: .docker/Dockerfile.dotNet.Worker
    #   entrypointDll: thc.HotKnobs.Domains.Dummy.Worker.dll
    #   imageName: thc/app/hotknobs/domains/dummy/Worker

contracts:
  file: ./Contracts/Dummy.Contracts.tsp

ef:
  contexts:
  - contextName: PostgresDummyContext
    projectDirectory: Persistence.Postgres
    projectName: Dummy.Persistence.Postgres.csproj
