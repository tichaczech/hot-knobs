  mongo-rs1:
    image: mongo:latest
    container_name: thc-hotknobs-mongo-rs1
    entrypoint:
      [
        "/usr/bin/mongod",
        "--bind_ip_all",
        "--replSet",
        "dbrs"
      ]
    hostname: mongo-rs1
    # network_mode: host
    networks:
      - default
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - ./_data/mongo/1:/data/db

  mongo-rs2:
    image: mongo:latest
    container_name: thc-hotknobs-mongo-rs2
    entrypoint:
      [
        "/usr/bin/mongod",
        "--bind_ip_all",
        "--replSet",
        "dbrs"
      ]
    hostname: mongo-rs2
    # network_mode: host
    networks:
      - default
    ports:
      - "27018:27017"
    restart: always
    volumes:
      - ./_data/mongo/2:/data/db

  mongo-rs3:
    image: mongo:latest
    container_name: thc-hotknobs-mongo-rs3
    entrypoint:
      [
        "/usr/bin/mongod",
        "--bind_ip_all",
        "--replSet",
        "dbrs"
      ]
    hostname: mongo-rs3
    # network_mode: host
    networks:
      - default
    ports:
      - "27019:27017"
    restart: always
    volumes:
      - ./_data/mongo/3:/data/db

  mongo-rsinit:
    image: mongo
    container_name: thc-hotknobs-mongo-rsinit
    depends_on:
      - mongo-rs1
      - mongo-rs2
      - mongo-rs3
    hostname: mongo-rsinit
    entrypoint:
      [
        "bash",
        "-c",
        "sleep 5 && mongosh --host mongo-rs1 ./mongo-rsinit.js"
      ]
    # network_mode: host
    networks:
      - default
    restart: "no"
    volumes:
      - ./.docker-compose/mongo-rsinit.js:/mongo-rsinit.js

