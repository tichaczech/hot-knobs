  #   volumes:
  #     - ./_data/mongo/2:/data/db

  redis:
    image: redis
    container_name: thc-hotknobs-redis
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    hostname: redis
    # network_mode: host
    networks:
      - default
    ports:
      - "6379:6379"
    restart: always
